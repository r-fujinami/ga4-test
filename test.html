<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GA4 x BigQuery 連携検証用ページ</title>

  <!-- Google tag (gtag.js) -->
  <!-- ※ 'G-XXXXXXXXXX' を実際の GA4 測定IDに書き換えてください -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XXXXXXXXXX');
  </script>
  <style>
    body { font-family: sans-serif; margin: 30px; line-height: 1.6; }
    button { padding: 10px 15px; margin: 5px 0; font-size: 14px; cursor: pointer; }
    #log { margin-top: 20px; padding: 12px; background: #f4f4f4; border-left: 4px solid #007bff; }
  </style>
</head>
<body>
  <h1>GA4 × BigQuery 連携検証用ページ</h1>
  <p>各ボタンをクリックしてイベントを発生させ、GA4およびBigQueryへのデータ転送を検証できます。</p>

  <hr>

  <h3>1. シンプルなカスタムイベント</h3>
  <button id="btn-custom">カスタムイベント (test_click) 送信</button>

  <h3>2. パラメータ付きイベント（購買風テスト）</h3>
  <button id="btn-param">パラメータ付きイベント (test_purchase) 送信</button>

  <h3>3. ユーザー属性（User Property）の送信</h3>
  <button id="btn-user-prop">ユーザー属性設定 (user_type: tester) 送信</button>

  <div id="log">ログ: 準備完了</div>

  <script>
    function setLog(msg) {
      document.getElementById('log').innerText = '送信ログ: ' + msg + ' (' + new Date().toLocaleTimeString() + ')';
    }

    // 1. カスタムイベント
    document.getElementById('btn-custom').addEventListener('click', function() {
      gtag('event', 'test_click', {
        'button_name': 'test_custom_button',
        'page_type': 'verification_page'
      });
      setLog('カスタムイベント (test_click) を送信しました');
    });

    // 2. パラメータ付きイベント
    document.getElementById('btn-param').addEventListener('click', function() {
      gtag('event', 'test_purchase', {
        'transaction_id': 'T_' + Math.floor(Math.random() * 1000000),
        'value': 1500,
        'currency': 'JPY',
        'item_name': '検証用サンプルアイテム'
      });
      setLog('パラメータ付きイベント (test_purchase) を送信しました');
    });

    // 3. ユーザー属性の設定
    document.getElementById('btn-user-prop').addEventListener('click', function() {
      gtag('set', 'user_properties', {
        'user_type': 'tester',
        'test_group': 'group_a'
      });
      gtag('event', 'user_profile_updated');
      setLog('ユーザー属性 (user_type: tester) を設定してイベントを送信しました');
    });
  </script>
</body>
</html>
